[tool.poetry]
name = "t2c-hub"
version = "0.1.0"
description = "Community hub for Text2Cypher datasets, benchmarks, evaluation and tools"
authors = ["T2C-Hub contributors"]
license = "BSD-3-Clause"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
mkdocs = "^1.6.1"
mkdocs-material = "^9.5.37"
mkdocs-table-reader-plugin = "^3.1.0"
PyYAML = "^6.0.2"
CyVer = "2.0.2"
fastapi = "^0.115.0"
neo4j = ">=5.27,<7"
uvicorn = {version = "^0.34.0", extras = ["standard"]}
sentence-transformers = ">=3,<6"
numpy = ">=1.26,<3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
