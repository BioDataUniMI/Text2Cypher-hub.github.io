site_name: T2C-Hub
site_description: A community hub for Text2Cypher datasets, benchmarks, evaluation and tools
site_url: !ENV [SITE_URL, "http://0.0.0.0:8002/"]
repo_url: https://github.com/BioDataUniMI/Text2Cypher-hub.github.io
repo_name: BioDataUniMI/T2C-Hub
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  icon:
    logo: material/hub-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit

hooks:
  - hooks/registry.py

plugins:
  - search
  - table-reader

nav:
  - T2C-Hub: index.md
  - T2C-Registry:
      - Browse the registry: registry.md
      - Contribute a resource: contribute.md
  - Evaluation guide:
      - T2C evaluation metrics: evaluation.md
  - Query validator: query-validator.md
  - About:
      - How to cite: citing.md
      - Support: support.md
      - Acknowledgements: acknowledgements.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tablesort.js
  - javascripts/registry.js
  - javascripts/benchmark-resource.js
  - javascripts/query-validator.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/BioDataUniMI/Text2Cypher-hub.github.io
      name: T2C-Hub on GitHub